plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.5'
    id 'maven-publish'
}

def COMPATIBLE_VERSIONS = ['26.1', '26.2']

tasks.register("printEnv") {
    doLast {
        def envFile = new File(System.getenv("GITHUB_ENV"))
        envFile.append("MOD_VERSION=${project.mod_version}\n")
        envFile.append("RELEASE_NAME=${project.archives_base_name}-${project.mod_version}\n")
        envFile.append("GAME_VERSIONS=${COMPATIBLE_VERSIONS}\n")
    }
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-${project.minecraft_version}"
}

repositories {
    maven {
        name = "Ladysnake Mods"
        url = 'https://maven.ladysnake.org/releases'
    }
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "Anvian"
        url = uri("https://maven.anvian.net/releases")
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation include("org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}")
    implementation include("org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}")

    localRuntime("com.terraformersmc:modmenu:${project.modmenu_version}")
    implementation("net.anvian.anvianslib:anvianslib-fabric-26.1:${project.anvianslib_version}")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = "${project.archives_base_name}-${project.minecraft_version}"
            from components.java
        }
    }

    repositories {
        maven {
            name = "Reposilite"
            url = uri(
                    version.toString().endsWith("SNAPSHOT")
                            ? "https://maven.anvian.net/snapshots"
                            : "https://maven.anvian.net/releases"
            )
            credentials {
                username = project.findProperty("reposilite.user") ?: System.getenv("REPOSILITE_USER")
                password = project.findProperty("reposilite.token") ?: System.getenv("REPOSILITE_TOKEN")
            }
        }
    }
}